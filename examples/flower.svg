    <ellipse cx="50" cy="18" rx="10" ry="16" transform="rotate(180 50 50)"/>
    <ellipse cx="50" cy="18" rx="10" ry="16" transform="rotate(225 50 50)"/>
    <ellipse cx="50" cy="18" rx="10" ry="16" transform="rotate(270 50 50)"/>
